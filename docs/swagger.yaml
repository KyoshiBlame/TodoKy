host: 172.21.253.37:5050
info:
  contact: {}
  description: Todo application REST-API
  title: todoky
  version: "1.0"
paths:
  /statistics:
    get:
      description: Получить статистику о существующий задачах в системе
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученная статистика
          schema:
            $ref: '#/definitions/internal_features_statistics_transport.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal sercer error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Статистика задач
      tags:
      - Statistics
  /tasks:
    get:
      description: Получение задач с опциональной пагинацией
      parameters:
      - description: Размер страницы с задачами
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с задачами
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка задач
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Получения списка задач
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Создать новую задачу в системе
      parameters:
      - description: CreateTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal sercer error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      description: Удалить существующую задачу в системе
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешно удалена задача
        "404":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal sercer error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить задачу
      tags:
      - Tasks
    get:
      description: Получить задачу из системы
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение задачи
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal sercer error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачу
      tags:
      - Tasks
    patch:
      consumes:
      - application/json
      description: |-
        Изменить существующую задачу в системе
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `description` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"description":"помыть лапки собаке"` - устанавливает новый номер в БД
        3. **Передано NULL**: `"description":null` - очистит поле в БД (set NULL)
        Ограниечение: `title` не может быть выставлен как NULL
      parameters:
      - description: ID изменяемой задачи
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTaskRequest тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное изменение задачи
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.TaskPatchedResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Изменнение задачи
      tags:
      - Tasks
  /users:
    get:
      description: Получение пользователей с опциональной пагинацией
      parameters:
