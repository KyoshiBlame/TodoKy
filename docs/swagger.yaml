        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Получения списка пользователей
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Создать нового пользователя в системе
      parameters:
      - description: CreateUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.CreateUsersRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный пользователь
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.CreateUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal sercer error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Создать пользователя
      tags:
      - Users
  /users/{id}:
    delete:
      description: Удалить сущетсвующего пользователя из системе
      parameters:
      - description: ID удаляемого пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удаление пользователя
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Удаление пользователя
      tags:
      - Users
    get:
      description: Получить сущетсвующего пользователя из системы
      parameters:
      - description: ID получаемого пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение пользователя
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
      summary: Получения пользователя
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: |-
        Изменить существующего пользователя в системе
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `phone_number` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"phone_number":"+72223331122"` - устанавливает новый номер в БД
        3. **Передано NULL**: `"phone_number":null` - очистит поле в БД (set NULL)
        Ограниечение: `full_name` не может быть выставлен как NULL
      parameters:
      - description: ID изменяемого пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUserRequest тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное изменение пользователя
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_KyoshiBlame_TodoKy_internal_core_transport_http_response.ErrorResponse'
        "500":
