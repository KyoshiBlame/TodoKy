services:
  todoky:
    build:
      context: .
      dockerfile: cmd/todoky/Dockerfile
    container_name: todoky
    environment:
      HTTP_ADDR: ":5050"
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      POSTGRES_HOST: todoky-postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-10s}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_FOLDER: /app/out/logs
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "5050:5050"
    depends_on:
      todoky-postgres:
        condition: service_healthy
    restart: unless-stopped

  todoky-postgres:
    image: postgres:18.4-bookworm
    container_name: todoky-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - todoky-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  todoky-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      todoky-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoky-postgres-port-forwarder
    command: -d -d TCP-LISTEN:5432,fork,reuseaddr TCP-CONNECT:todoky-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      todoky-postgres:
        condition: service_healthy

  swagger:
    build:
      context: ${PROJECT_ROOT:-.}
      dockerfile_inline: |
        FROM golang:1.26.2-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT:-.}:/code

volumes:
  todoky-postgres-data: