services:
  todoky:
    build:
      context: .
      dockerfile: cmd/todoky/Dockerfile
    container_name: todoky
    environment:
      HTTP_ADDR: ":5050"
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      POSTGRES_HOST: todoky-postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-10s}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_FOLDER: /app/out/logs
      AUTH_GRPC_ADDR: "auth-service:50051"
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "5050:5050"
    depends_on:
      todoky-postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  todoky-postgres:
    image: postgres:18.4-bookworm
    container_name: todoky-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - todoky-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  todoky-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      todoky-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoky-postgres-port-forwarder
    command: -d -d TCP-LISTEN:5432,fork,reuseaddr TCP-CONNECT:todoky-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      todoky-postgres:
        condition: service_healthy

  swagger:
    build:
      context: ${PROJECT_ROOT:-.}
      dockerfile_inline: |
        FROM golang:1.26.2-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT:-.}:/code


auth-db:
  image: postgres:18.4-bookworm
  container_name: auth-db
  environment:
    POSTGRES_USER: ${AUTH_DB_NAME:-auth}
    POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
    POSTGRES_DB: ${AUTH_DB_NAME:-auth}
  volumes"
    - auth-db-data:/var/lib/postgresql
  healtcheck:
    test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER -d $POSGRES_DB"
    interval: 5s
    retries: 10
  restart: unless-stopped

auth-service:
    build:
      context: ../authTodoky
      dockerfile: cmd/auth/Dockerfile
    container_name: auth-service
    environment:
      GRPC_PORT: "50051"
      POSTGRES_HOST: auth-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-10s}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    auth-db-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../auth-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-authpass}@auth-db:5432/${AUTH_DB_NAME:-auth}?sslmode=disable"
      - "up"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  todoky-postgres-data:
  auth-db-data: 