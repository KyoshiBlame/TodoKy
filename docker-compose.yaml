service:
  build:
    context: ${PROJECT_ROOT}
    dockerfile: ${PROJECT_ROOT}/cmd/todoky/Dockerfile
  container_name: todoky
  environment:
    - HTTP_ADDR=":5050"
    - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
    - POSTGRES_HOST=todoky-postgres
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=&{POSTGRES_DB}
    - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
    - LOGGER_LEVEL=${LOGGER_LEVEL}
    - LOGGER_FOLDER=/app/out/logs
  volumes:
    - ${PROJECT_ROOT}/out/logs:/app/out/logs
  ports:
    - "5050:5050"
  restart: always

services:
  todoky-postgres:
    image: postgres:18.4-bookworm
    container_name: todoky-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - todoky-postgres-data:/var/lib/postgresql
    restart: always

  todoky-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoky-postgres-port-forwarder
    command: -d -d TCP-LISTEN:5432,fork,reuseaddr TCP-CONNECT:todoky-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  todoky-postgres-data: