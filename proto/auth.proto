syntax = "proto3";

package auth;

option go_package = "github.com/KyoshiBlame/TodoKy/proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Login(LoginRequest) returns (LoginResponse);

  rpc Validate(ValidateRequestToken) returns (ValidateResponseToken);
}

message RegisterRequest {
    string email        = 1;
    string password     = 2;
    string full_name    = 3;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
    string email    = 1;
    string password = 2;
}

message LoginResponse {
    string acces_token  = 1;
    int64 user_id      = 2;
}

message ValidateRequestToken {
    string token = 1;
}

message ValidateResponseToken {
    bool valid      = 1;
    int64 user_id   = 2;
    string email    = 3;
}