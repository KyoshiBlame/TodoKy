<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TodoKy — вход и регистрация" />
    <meta name="theme-color" content="#7c3aed" />
    <title>TodoKy — авторизация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #0b0d13;
        --bg-secondary: #111320;
        --bg-card: #161929;
        --bg-card-hover: #1c2038;
        --bg-elevated: #1e2240;
        --bg-input: #131626;

        --border: rgba(255, 255, 255, 0.06);
        --border-focus: #7c3aed;

        --text-primary: #eef0f6;
        --text-secondary: #8b8fa7;
        --text-muted: #5c6080;

        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.12);
        --accent-glow: rgba(124, 58, 237, 0.3);
        --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);

        --success: #22c55e;
        --danger: #ef4444;
        --danger-soft: rgba(239, 68, 68, 0.1);

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;

        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
        --shadow-glow: 0 0 40px rgba(124, 58, 237, 0.15);

        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; border: none; background: transparent; }

      /* Ambient glow */
      body::before {
        content: '';
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 600px;
        background: radial-gradient(ellipse, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      /* ========== AUTH CARD ========== */
      .auth-card {
        position: relative;
        z-index: 1;
        width: min(440px, calc(100vw - 32px));
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg), var(--shadow-glow);
        animation: cardIn 0.5s var(--transition-spring);
        overflow: hidden;
      }

      /* ========== BRAND ========== */
      .auth-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px 28px 0;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        background: var(--accent-gradient);
        color: #fff;
        font-size: 20px;
        font-weight: 900;
        box-shadow: 0 4px 16px var(--accent-glow);
      }
      .brand-text {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.8px;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ========== TABS ========== */
      .auth-tabs {
        display: flex;
        margin: 24px 28px 0;
        border-bottom: 1px solid var(--border);
      }
      .auth-tab {
        flex: 1;
        padding: 12px 0;
        text-align: center;
        font-weight: 600;
        font-size: 15px;
        color: var(--text-muted);
        position: relative;
        transition: color var(--transition-fast);
      }
      .auth-tab:hover { color: var(--text-secondary); }
      .auth-tab.active { color: var(--accent); }
      .auth-tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 20%;
        right: 20%;
        height: 2px;
        background: var(--accent-gradient);
        border-radius: 2px 2px 0 0;
      }

      /* ========== FORMS ========== */
      .auth-form {
        display: none;
        flex-direction: column;
        gap: 18px;
        padding: 28px;
      }
      .auth-form.active {
        display: flex;
        animation: fadeUp 0.3s ease-out;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--bg-input);
        color: var(--text-primary);
        outline: none;
        transition: all var(--transition-fast);
      }
      .form-group input::placeholder {
        color: var(--text-muted);
      }
      .form-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .submit-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        margin-top: 4px;
        border-radius: var(--radius-md);
        background: var(--accent-gradient);
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 4px 16px var(--accent-glow);
        transition: all var(--transition-fast);
      }
      .submit-button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px var(--accent-glow);
      }
      .submit-button:active:not(:disabled) { transform: translateY(0); }
      .submit-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* ========== ERROR MESSAGE ========== */
      .error-message {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 13px;
        font-weight: 500;
        display: none;
        animation: fadeUp 0.2s ease-out;
      }
      .error-message.visible {
        display: block;
      }

      /* ========== SUCCESS MESSAGE ========== */
      .success-message {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
        font-size: 13px;
        font-weight: 500;
        display: none;
        animation: fadeUp 0.2s ease-out;
      }
      .success-message.visible {
        display: block;
      }

      /* ========== FOOTER ========== */
      .auth-footer {
        padding: 0 28px 28px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
      }
      .auth-footer a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        transition: opacity var(--transition-fast);
      }
      .auth-footer a:hover { opacity: 0.8; }

      /* ========== ANIMATIONS ========== */
      @keyframes cardIn {
        from { opacity: 0; transform: scale(0.95) translateY(16px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 480px) {
        .auth-card { border-radius: var(--radius-lg); }
        .auth-brand { padding-top: 24px; }
        .auth-form { padding: 20px; }
        .auth-footer { padding: 0 20px 20px; }
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <!-- Brand -->
      <div class="auth-brand">
        <span class="brand-mark">✓</span>
        <span class="brand-text">TodoKy</span>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>

          <form class="auth-form active" id="login-form">
        <div class="error-message" id="login-error"></div>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="submit-button" id="login-submit">Войти</button>
      </form>

      <form class="auth-form" id="register-form">
        <div class="error-message" id="register-error"></div>
        <div class="success-message" id="register-success"></div>
        <div class="form-group">
          <label for="register-name">Имя</label>
          <input type="text" id="register-name" name="full_name" placeholder="Ваше имя" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="register-password">Пароль</label>
          <input type="password" id="register-password" name="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="submit-button" id="register-submit">Зарегистрироваться</button>
      </form>

      <div class="auth-footer" id="auth-footer">
        Нет аккаунта? <a href="#" id="switch-to-register">Зарегистрируйтесь</a>
      </div>
    </div>

    <script>
      const tabs = document.querySelectorAll('.auth-tab');
      const forms = document.querySelectorAll('.auth-form');
      const footer = document.getElementById('auth-footer');

      function switchTab(tabName) {
        tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
        forms.forEach(f => f.classList.toggle('active', f.id === tabName + '-form'));

        if (tabName === 'login') {
          footer.innerHTML = 'Нет аккаунта? <a href="#" id="switch-to-register">Зарегистрируйтесь</a>';
          document.getElementById('switch-to-register').addEventListener('click', e => {
            e.preventDefault();
            switchTab('register');
          });
        } else {
          footer.innerHTML = 'Уже есть аккаунт? <a href="#" id="switch-to-login">Войдите</a>';
          document.getElementById('switch-to-login').addEventListener('click', e => {
            e.preventDefault();
            switchTab('login');
          });
        }

        document.querySelectorAll('.error-message, .success-message').forEach(el => {
          el.classList.remove('visible');
          el.textContent = '';
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
      });

      document.getElementById('switch-to-register').addEventListener('click', e => {
        e.preventDefault();
        switchTab('register');
      });

      function showError(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.classList.add('visible');
      }

      function showSuccess(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.classList.add('visible');
      }

      function clearMessages() {
        document.querySelectorAll('.error-message, .success-message').forEach(el => {
          el.classList.remove('visible');
          el.textContent = '';
        });
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();

        const submitBtn = document.getElementById('login-submit');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Вход...';

        try {
          const response = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('login-email').value,
              password: document.getElementById('login-password').value,
            }),
          });

          if (!response.ok) {
            const data = await response.json().catch(() => null);
            throw new Error(data?.error || data?.message || 'Неверный email или пароль');
          }

          window.location.href = '/';
        } catch (err) {
          showError('login-error', err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Войти';
        }
      });

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();

        const submitBtn = document.getElementById('register-submit');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Регистрация...';

        try {
          const response = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('register-email').value,
              password: document.getElementById('register-password').value,
              full_name: document.getElementById('register-name').value,
            }),
          });

          if (!response.ok) {
            const data = await response.json().catch(() => null);
            const msg = data?.error || data?.message || 'Ошибка регистрации';
            if (msg.includes('duplicate key') || msg.includes('already exists')) {
              throw new Error('Пользователь с таким email уже существует');
            }
            throw new Error(msg);
          }

          showSuccess('register-success', 'Аккаунт создан! Войдите с вашими данными.');
          setTimeout(() => switchTab('login'), 1500);
        } catch (err) {
          showError('register-error', err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Зарегистрироваться';
        }
      });
    </script>
  </body>
</html>
